<!doctype html>
<html lang="fil">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Patak</title>
  <meta name="description" content="Isang interactive na kuwento tungkol sa 'ganyan talaga.' THEO 12 · Gacusan & Wagan" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3C16 3 7 14 7 20a9 9 0 0 0 18 0c0-6-9-17-9-17z' fill='%239fc6d8'/%3E%3C/svg%3E" />
</head>
<body>
  <canvas id="gl"></canvas>

  <div id="ui">
    <div class="bar top"></div>
    <div class="bar bottom"></div>
    <div id="fader"></div>

    <div id="card"><div class="part"></div><h2 class="title"></h2><div class="meta"></div></div>
    <div id="charcard"><h2 class="name"></h2><div class="lines"></div></div>
    <div id="bigline"></div>

    <div id="patak">
      <svg class="drop" viewBox="0 0 40 60"><path d="M20 4C20 4 8 22 8 32a12 12 0 0 0 24 0C32 22 20 4 20 4z"/></svg>
      <svg class="ripple" viewBox="0 0 120 30"><ellipse cx="60" cy="15" rx="20" ry="5"/><ellipse cx="60" cy="15" rx="40" ry="9"/><ellipse cx="60" cy="15" rx="58" ry="13"/></svg>
      <div class="txt"><div class="who"></div><div class="state"></div></div>
    </div>

    <div id="sub"><div class="who"></div><div class="line"></div></div>

    <div id="choice">
      <div class="def">Walang gagawin</div>
      <div class="dialrow">
        <button class="opt l"><span class="lab"></span><span class="ln"></span></button>
        <div class="dial"><svg viewBox="0 0 120 120">
          <circle class="ring-bg" cx="60" cy="60" r="52"/>
          <circle class="ring" cx="60" cy="60" r="52"/>
          <circle class="inner" cx="60" cy="60" r="40"/>
          <g class="ticks"><line x1="60" y1="9" x2="60" y2="17" transform="rotate(0 60 60)"/><line x1="60" y1="9" x2="60" y2="14" transform="rotate(15 60 60)"/><line x1="60" y1="9" x2="60" y2="14" transform="rotate(30 60 60)"/><line x1="60" y1="9" x2="60" y2="17" transform="rotate(45 60 60)"/><line x1="60" y1="9" x2="60" y2="14" transform="rotate(60 60 60)"/><line x1="60" y1="9" x2="60" y2="14" transform="rotate(75 60 60)"/><line x1="60" y1="9" x2="60" y2="17" transform="rotate(90 60 60)"/><line x1="60" y1="9" x2="60" y2="14" transform="rotate(105 60 60)"/><line x1="60" y1="9" x2="60" y2="14" transform="rotate(120 60 60)"/><line x1="60" y1="9" x2="60" y2="17" transform="rotate(135 60 60)"/><line x1="60" y1="9" x2="60" y2="14" transform="rotate(150 60 60)"/><line x1="60" y1="9" x2="60" y2="14" transform="rotate(165 60 60)"/><line x1="60" y1="9" x2="60" y2="17" transform="rotate(180 60 60)"/><line x1="60" y1="9" x2="60" y2="14" transform="rotate(195 60 60)"/><line x1="60" y1="9" x2="60" y2="14" transform="rotate(210 60 60)"/><line x1="60" y1="9" x2="60" y2="17" transform="rotate(225 60 60)"/><line x1="60" y1="9" x2="60" y2="14" transform="rotate(240 60 60)"/><line x1="60" y1="9" x2="60" y2="14" transform="rotate(255 60 60)"/><line x1="60" y1="9" x2="60" y2="17" transform="rotate(270 60 60)"/><line x1="60" y1="9" x2="60" y2="14" transform="rotate(285 60 60)"/><line x1="60" y1="9" x2="60" y2="14" transform="rotate(300 60 60)"/><line x1="60" y1="9" x2="60" y2="17" transform="rotate(315 60 60)"/><line x1="60" y1="9" x2="60" y2="14" transform="rotate(330 60 60)"/><line x1="60" y1="9" x2="60" y2="14" transform="rotate(345 60 60)"/></g>
          <path class="drop" d="M60 47c0 0-7 9-7 14a7 7 0 0 0 14 0c0-5-7-14-7-14z"/>
          <g class="needle"><line x1="60" y1="60" x2="60" y2="24"/><path d="M60 19l-4 8h8z"/></g>
        </svg></div>
        <button class="opt r"><span class="lab"></span><span class="ln"></span></button>
      </div>
    </div>

    <div id="ask"></div>
    <div id="hint">▸</div>
    <div id="stamp"></div>

    <div id="title">
      <div class="drop-anim"><svg viewBox="0 0 40 60"><path d="M20 4C20 4 8 22 8 32a12 12 0 0 0 24 0C32 22 20 4 20 4z"/></svg></div>
      <h1>PATAK</h1>
      <p class="sub">isang interactive na kuwento</p>
      <div class="load"><i></i></div>
      <button id="start" disabled>Naglo-load…</button>
      <p class="keys">Mas maganda kung naka-fullscreen at may tunog · F = fullscreen · M = mute</p>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
